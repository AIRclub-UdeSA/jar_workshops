name: Sync PR review status

on:
  pull_request:
    types: [review_requested]

jobs:
  set-in-review:
    runs-on: ubuntu-latest
    steps:
      - name: Set project Status to In review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwDOEjyD084BhtOr";
            const statusFieldId = "PVTSSF_lADOEjyD084BhtOrzhgn_fY";
            const inReviewOptionId = "5c347fba";
            const prNodeId = context.payload.pull_request.node_id;

            const result = await github.graphql(
              `query($prId: ID!) {
                node(id: $prId) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { number }
                      }
                    }
                  }
                }
              }`,
              { prId: prNodeId }
            );

            const item = result.node.projectItems.nodes.find(n => n.project.number === 3);

            if (!item) {
              console.log("PR is not on project 3 yet, skipping.");
              return;
            }

            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }`,
              { project: projectId, item: item.id, field: statusFieldId, option: inReviewOptionId }
            );

            console.log("Status set to In review for PR #" + context.payload.pull_request.number);
